<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Tesla Connected</title></head>
<body style="font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px;">
  <h2>Almost done! Copy your authorization code below:</h2>
  <p>Paste this code into your Grok Bot chat to finish linking your Tesla:</p>
  <pre id="code" style="background:#f4f4f4;padding:14px;border-radius:8px;font-size:16px;overflow-x:auto;user-select:all;"></pre>
  <button id="copyBtn" style="padding:10px 18px;font-size:15px;border-radius:6px;border:none;background:#111;color:#fff;cursor:pointer;">Copy Code</button>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code") || window.location.href;
    document.getElementById("code").textContent = code;
    document.getElementById("copyBtn").onclick = () => {
      navigator.clipboard.writeText(code);
      document.getElementById("copyBtn").textContent = "Copied! Paste this in Grok Bot chat";
    };
  </script>
</body>
</html>
